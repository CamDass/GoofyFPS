# ========================================================
# Reverse proxy nginx pour GoofyMaster (S10 + S12)
# À placer dans /etc/nginx/sites-available/ et lier dans sites-enabled/.
# Sous-domaine DÉDIÉ, isolé du portfolio existant.
#
# TLS : réutilise certbot déjà en place (certonly -d gfps-api.example.com).
# Le pare-feu n'ouvre que : 443/tcp (ce proxy) et 7790/udp (rendez-vous NAT).
# ========================================================

# Zone de limite de débit (S12) : 10 req/s par IP, rafale de 20
limit_req_zone $binary_remote_addr zone=goofyapi:10m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gfps-api.example.com;   # <-- À REMPLACER par ton vrai sous-domaine

    ssl_certificate     /etc/letsencrypt/live/gfps-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfps-api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS (S10)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Corps de requête minuscule : on refuse tout gros payload au plus tôt (S11)
    client_max_body_size 4k;

    location /v1/ {
        limit_req zone=goofyapi burst=20 nodelay;

        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La VRAIE IP du client, pour la limite par-IP applicative + rooms/IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    # Tout le reste (scan, chemins inconnus) -> 404 sec
    location / { return 404; }
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gfps-api.example.com;
    return 301 https://$host$request_uri;
}
